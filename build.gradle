plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.1.1-forge-1.20.1'
group = 'com.deuteriumix.mwpublic'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.add('-proc:none') }
jar { manifest.attributes('MixinConfigs': 'mwpublic.mixins.json'); finalizedBy 'reobfJar' }
