plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '1.1.1'
group = 'com.deuteriumix.mwpublic'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge.version = '21.1.248'
dependencies {
    compileOnly files('libs/gd656killicon-1.3.2-1.21.1-neoforge.jar', 'libs/tacz-neoforge-1.21.1-1.2.0.jar')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-proc:none')
}
